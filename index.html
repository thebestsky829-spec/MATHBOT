<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>數學聊天機器人</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- 🌟 新增：設定 MathJax 認得 $ 符號 🌟 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['[', ']']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <style>
    body { font-family: "微軟正黑體", sans-serif; display: flex; height: 100vh; margin: 0; background-color: #f4f7f6; }
    #sidebar { width: 30%; border-right: 2px solid #e0e0e0; padding: 20px; box-sizing: border-box; background: #ffffff; overflow-y: auto;}
    #sidebar select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;}
    #question-display img { max-width: 100%; margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; }
    #main { width: 70%; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box;}
    #login-section { text-align: center; margin-top: 20vh; }
    #chat-box { flex-grow: 1; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
    .input-area { display: flex; gap: 10px; }
    input[type="text"] { flex-grow: 1; padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 12px 24px; cursor: pointer; background-color: #4285f4; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold;}
    button:hover { background-color: #3367d6; }
    .hidden { display: none !important; }
    .msg-box { margin-bottom: 12px; line-height: 1.6; }
    .msg-sender { font-weight: bold; margin-right: 8px; color: #4285f4; }
  </style>
</head>
<body>

  <div id="sidebar" class="hidden">
    <h2 style="color: #333; margin-top: 0;">數學題庫</h2>
    <select id="round-select">
      <option value="">載入中...</option>
    </select>
    <select id="qnum-select" disabled>
      <option value="">請先選擇回合...</option>
    </select>
    <div id="question-display" style="margin-top: 20px;">
      <div id="q-content-text" style="color: #666; font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 5px;" class="hidden"></div>
      <img id="q-image" src="" alt="題目圖片" class="hidden">
    </div>
  </div>

  <div id="main">
    <div id="login-section">
      <h2 style="color: #333;">國中數學 AI 小幫手</h2>
      <p style="color: #666; margin-bottom: 20px;">請使用學校 Google 帳號登入</p>
      <div style="display: flex; justify-content: center;">
        <!-- ⚠️ 記得填入您的 Client ID -->
        <div id="g_id_onload"
             data-client_id="752802782317-d2op6o14k7u69rk43pgre96tb6al21u7.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
      </div>
    </div>

    <div id="chat-section" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <h3 style="margin-top: 0; color: #333;">聊天室 <span id="user-info" style="font-size: 14px; color: gray; font-weight: normal;"></span></h3>
      <div id="chat-box"></div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="請輸入你的問題...">
        <button onclick="sendMessage()">送出</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 記得填入您的 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyn5ueCeKSMkk3lKfUzQ1WF11nb5pP-zBUk7MOSi2aQ0kO7YHMCMMfYOyhxfq9V9rc7/exec"; 
    
    let currentUser = "";
    let allQuestions = [];
    let selectedQuestionContext = ""; 

    function parseJwt (token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      currentUser = payload.email;
      
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("sidebar").classList.remove("hidden");
      document.getElementById("chat-section").classList.remove("hidden");
      document.getElementById("user-info").innerText = `(${currentUser})`;

      loadQuestions(); 
    }

    async function loadQuestions() {
      try {
        const res = await fetch(GAS_URL + "?action=getQuestions");
        allQuestions = await res.json();
        const rounds = [...new Set(allQuestions.map(q => q.round).filter(r => r !== ""))];
        let roundOptions = `<option value="">請選擇回合...</option>`;
        rounds.forEach(r => roundOptions += `<option value="${r}">${r}</option>`);
        document.getElementById("round-select").innerHTML = roundOptions;
      } catch (err) {
        document.getElementById("round-select").innerHTML = `<option value="">題庫載入失敗</option>`;
      }
    }

    document.getElementById("round-select").addEventListener("change", function(e) {
      const selectedRound = e.target.value;
      const qnumSelect = document.getElementById("qnum-select");
      if (!selectedRound) {
        qnumSelect.innerHTML = `<option value="">請先選擇回合...</option>`;
        qnumSelect.disabled = true;
        clearQuestionDisplay();
        return;
      }
      const filteredQs = allQuestions.filter(q => q.round === selectedRound);
      let qnumOptions = `<option value="">請選擇題號...</option>`;
      filteredQs.forEach(q => { if(q.qNum) qnumOptions += `<option value="${q.qNum}">${q.qNum}</option>`; });
      qnumSelect.innerHTML = qnumOptions;
      qnumSelect.disabled = false;
      clearQuestionDisplay();
    });

    document.getElementById("qnum-select").addEventListener("change", function(e) {
      const selectedRound = document.getElementById("round-select").value;
      const selectedQNum = e.target.value;
      if (!selectedQNum) { clearQuestionDisplay(); return; }

      const question = allQuestions.find(q => q.round === selectedRound && q.qNum === selectedQNum);
      if (question) {
        const textEl = document.getElementById("q-content-text");
        if (question.content) {
          textEl.innerText = "背景資訊：" + question.content;
          textEl.classList.remove("hidden");
        } else { textEl.classList.add("hidden"); }
        
        const imgEl = document.getElementById("q-image");
        if (question.imgUrl) {
          imgEl.src = question.imgUrl;
          imgEl.classList.remove("hidden");
        } else { imgEl.classList.add("hidden"); }

        selectedQuestionContext = `目前學生正在看：${question.round} ${question.qNum}。老師設定的背景資訊：${question.content}`;
        addChatMsg("系統", `已切換至 ${question.round} ${question.qNum}，可以針對這題開始發問囉！`);
      }
    });

    function clearQuestionDisplay() {
      document.getElementById("q-content-text").classList.add("hidden");
      document.getElementById("q-image").classList.add("hidden");
      selectedQuestionContext = "";
    }

    function addChatMsg(sender, msg) {
      const box = document.getElementById("chat-box");
      const color = sender === "系統" ? "#e67c73" : (sender === "你" ? "#34a853" : "#4285f4");
      
      let formattedMsg = msg.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      box.innerHTML += `<div class="msg-box"><span class="msg-sender" style="color:${color}">${sender}:</span>${formattedMsg}</div>`;
      box.scrollTop = box.scrollHeight;

      if (window.MathJax) {
        MathJax.typesetPromise([box]).catch(function (err) {
          console.log('MathJax 渲染失敗: ' + err.message);
        });
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById("user-input");
      const msg = inputEl.value.trim();
      if (!msg) return;

      addChatMsg("你", msg);
      inputEl.value = "";
      
      const loadingId = "loading-" + Date.now();
      document.getElementById("chat-box").innerHTML += `<div id="${loadingId}" class="msg-box" style="color:gray;">AI 思考中...</div>`;

      // 🌟 新增：擷取學生目前選擇的題號標籤 🌟
      let taskName = "一般性提問";
      const selRound = document.getElementById("round-select").value;
      const selQNum = document.getElementById("qnum-select").value;
      if (selRound && selQNum) {
        taskName = selRound + " " + selQNum;
      }

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            userId: currentUser,
            userMessage: msg,
            questionContext: selectedQuestionContext,
            currentTask: taskName // 把標籤傳給後端寫入試算表
          })
        });
        
        const result = await response.json();
        document.getElementById(loadingId).remove();
        
        if (result.aiMessage) {
          addChatMsg("AI", result.aiMessage);
        } else {
          addChatMsg("系統", "連線發生異常，請重試。");
        }
      } catch(e) {
         document.getElementById(loadingId).innerText = "系統: 傳送失敗，請重試。";
         console.error(e);
      }
    }
  </script>
</body>
</html>
